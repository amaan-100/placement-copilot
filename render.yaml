services:
  - type: web
    name: placement-copilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_PROVIDER_LABEL
        value: requesty
      - key: LLM_BASE_URL
        value: https://router.requesty.ai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: google/gemma-4-31b-it
      - key: LLM_JSON_MODE
        value: "false"
      - key: LLM_STATUS_CACHE_SECONDS
        value: "300"
      - key: LLM_DAILY_REQUEST_LIMIT
        value: "180"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
